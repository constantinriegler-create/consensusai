<svg width="100%" viewBox="0 0 680 590" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>VELE AI Premium – 3-round debate with optional web search</title>
  <desc>User prompt goes to VELE AI Premium, distributed to 4 models plus optional web search, 3-round blind debate, synthesis produces winner with full transcript.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- User prompt -->
  <rect x="270" y="20" width="140" height="44" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="0.5"/>
  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#aaa" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">User prompt</text>

  <line x1="340" y1="64" x2="340" y2="84" marker-end="url(#arrow)" stroke="#555" stroke-width="1.5"/>

  <!-- VELE AI Premium -->
  <rect x="200" y="84" width="280" height="56" rx="8" fill="#1e1a2e" stroke="#a855f7" stroke-width="0.5"/>
  <text x="340" y="106" text-anchor="middle" dominant-baseline="central" fill="#c084fc" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">VELE AI Premium</text>
  <text x="340" y="126" text-anchor="middle" dominant-baseline="central" fill="#a855f7" font-family="-apple-system,sans-serif" font-size="12">Distributes to 4 models in parallel</text>

  <!-- Fan-out -->
  <path d="M263 140 L76 182" fill="none" stroke="#555" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M296 140 L200 182" fill="none" stroke="#555" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M330 140 L324 182" fill="none" stroke="#555" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M374 140 L448 182" fill="none" stroke="#555" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M420 140 L582 182" fill="none" stroke="#555" stroke-width="0.5" stroke-dasharray="4 2" opacity="0.5" marker-end="url(#arrow)"/>

  <!-- Round 1 label -->
  <text x="340" y="177" text-anchor="middle" fill="#555" font-family="-apple-system,sans-serif" font-size="11">Round 1 — independent, models don't see each other</text>

  <!-- Model nodes -->
  <rect x="20" y="185" width="112" height="56" rx="8" fill="#0d1f18" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="76" y="207" text-anchor="middle" dominant-baseline="central" fill="#6ee7b7" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">GPT-4o</text>
  <text x="76" y="225" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" font-family="-apple-system,sans-serif" font-size="12">OpenAI</text>

  <rect x="144" y="185" width="112" height="56" rx="8" fill="#0d1f18" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="200" y="207" text-anchor="middle" dominant-baseline="central" fill="#6ee7b7" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">Claude</text>
  <text x="200" y="225" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" font-family="-apple-system,sans-serif" font-size="12">Anthropic</text>

  <rect x="268" y="185" width="112" height="56" rx="8" fill="#0d1f18" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="324" y="207" text-anchor="middle" dominant-baseline="central" fill="#6ee7b7" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">DeepSeek</text>
  <text x="324" y="225" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" font-family="-apple-system,sans-serif" font-size="12">DeepSeek</text>

  <rect x="392" y="185" width="112" height="56" rx="8" fill="#0d1f18" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="448" y="207" text-anchor="middle" dominant-baseline="central" fill="#6ee7b7" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">Grok</text>
  <text x="448" y="225" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" font-family="-apple-system,sans-serif" font-size="12">xAI</text>

  <!-- Web search -->
  <rect x="516" y="185" width="132" height="56" rx="8" fill="#0d1624" stroke="#185fa5" stroke-width="0.5" stroke-dasharray="5 2"/>
  <text x="582" y="207" text-anchor="middle" dominant-baseline="central" fill="#60a5fa" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">Web search</text>
  <text x="582" y="225" text-anchor="middle" dominant-baseline="central" fill="#185fa5" font-family="-apple-system,sans-serif" font-size="12">(optional)</text>

  <!-- Fan-in to Round 2 -->
  <path d="M76 241 L148 272" fill="none" stroke="#555" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M200 241 L258 272" fill="none" stroke="#555" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M324 241 L322 272" fill="none" stroke="#555" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M448 241 L432 272" fill="none" stroke="#555" stroke-width="0.5" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M582 241 L556 272" fill="none" stroke="#555" stroke-width="0.5" stroke-dasharray="4 2" opacity="0.5" marker-end="url(#arrow)"/>

  <!-- Round 2 -->
  <rect x="44" y="272" width="592" height="72" rx="8" fill="#1e1408" stroke="#854f0b" stroke-width="0.5"/>
  <text x="340" y="296" text-anchor="middle" dominant-baseline="central" fill="#fbbf24" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">Round 2 — seeing opposition</text>
  <text x="340" y="320" text-anchor="middle" dominant-baseline="central" fill="#854f0b" font-family="-apple-system,sans-serif" font-size="12">Models read all other responses · challenge · refine · argue deeper</text>

  <line x1="340" y1="344" x2="340" y2="366" marker-end="url(#arrow)" stroke="#555" stroke-width="1.5"/>

  <!-- Round 3 -->
  <rect x="150" y="366" width="380" height="56" rx="8" fill="#1e1408" stroke="#854f0b" stroke-width="0.5"/>
  <text x="340" y="388" text-anchor="middle" dominant-baseline="central" fill="#fbbf24" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">Round 3 — blind vote</text>
  <text x="340" y="408" text-anchor="middle" dominant-baseline="central" fill="#854f0b" font-family="-apple-system,sans-serif" font-size="12">Models vote on best answer · no idea who said what</text>

  <line x1="340" y1="422" x2="340" y2="444" marker-end="url(#arrow)" stroke="#555" stroke-width="1.5"/>

  <!-- Synthesis -->
  <rect x="200" y="444" width="280" height="56" rx="8" fill="#1e1a2e" stroke="#a855f7" stroke-width="0.5"/>
  <text x="340" y="466" text-anchor="middle" dominant-baseline="central" fill="#c084fc" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">Synthesis</text>
  <text x="340" y="486" text-anchor="middle" dominant-baseline="central" fill="#a855f7" font-family="-apple-system,sans-serif" font-size="12">Winner · vote count · confidence</text>

  <line x1="340" y1="500" x2="340" y2="522" marker-end="url(#arrow)" stroke="#555" stroke-width="1.5"/>

  <!-- Result -->
  <rect x="170" y="522" width="340" height="56" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="0.5"/>
  <text x="340" y="544" text-anchor="middle" dominant-baseline="central" fill="#aaa" font-family="-apple-system,sans-serif" font-size="14" font-weight="500">Best answer, back to you</text>
  <text x="340" y="564" text-anchor="middle" dominant-baseline="central" fill="#555" font-family="-apple-system,sans-serif" font-size="12">Full transcript · all 3 rounds · winner + vote count</text>
</svg>
